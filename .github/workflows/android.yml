name: Build Mushaf Libya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Quran PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          ls -lh upload-parts/
          shopt -s nullglob
          parts=(upload-parts/mushaf.part-*)
          if [ "${#parts[@]}" -lt 1 ]; then
            echo "::error::No Quran PDF parts found in upload-parts/"
            exit 1
          fi
          cat "${parts[@]}" > public/assets/mushaf-qalun.pdf
          test -s public/assets/mushaf-qalun.pdf
          file public/assets/mushaf-qalun.pdf
          wc -c public/assets/mushaf-qalun.pdf

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      -       - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-libya-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
