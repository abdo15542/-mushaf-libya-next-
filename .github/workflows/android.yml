
name: Build Mushaf Libya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Quran PDF
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/assets

          if [ ! -d "upload-parts" ]; then
            echo "::error::Directory upload-parts/ not found"
            exit 1
          fi

          shopt -s nullglob
          parts=(upload-parts/mushaf.part-*)

          if [ "${#parts[@]}" -lt 1 ]; then
            echo "::error::No Quran PDF parts found in upload-parts/"
            exit 1
          fi

          printf '%s\n' "Found PDF parts:"
          printf '%s\n' "${parts[@]}"

          cat "${parts[@]}" > public/assets/mushaf-qalun.pdf

          test -s public/assets/mushaf-qalun.pdf

          echo "PDF file information:"
          file public/assets/mushaf-qalun.pdf
          wc -c public/assets/mushaf-qalun.pdf

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "capacitor.config.ts" ] && \
             [ ! -f "capacitor.config.json" ] && \
             [ ! -f "capacitor.config.js" ]; then
            echo "::error::Capacitor configuration file not found"
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "::error::Android project directory not found"
            exit 1
          fi

          echo "Capacitor configuration and Android directory found."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-libya-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
