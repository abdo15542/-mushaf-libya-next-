
name: Build and Release Mushaf Libya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Quran PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          test -d upload-parts
          shopt -s nullglob
          parts=(upload-parts/mushaf.part-*)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" > public/assets/mushaf-qalun.pdf
          test -s public/assets/mushaf-qalun.pdf

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/mushaf-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/mushaf-signing/mushaf-release.jks"
          test -s "$RUNNER_TEMP/mushaf-signing/mushaf-release.jks"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mushaf-signing/mushaf-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            mushaf-libya.apk
          ls -lh mushaf-libya.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-libya-release-apk
          path: mushaf-libya.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mushaf-v1.0.${{ github.run_number }}
          name: مصحف ليبيا 1.0.${{ github.run_number }}
          generate_release_notes: true
          files: mushaf-libya.apk
